<html>
    <head> 
        <title>1 to 9 Colored Table</title> 
    </head> 
    <body> 
    <table border="1" width="500" height="300"> 
        <tr> 
            <td bgcolor="sky blue">1</td> 
            <td colspan="3" bgcolor="pink">2</td>
        </tr> 
        <tr> 
            <td rowspan="3" bgcolor="yellow">3</td>     
            <td bgcolor="orange">4</td> 
            <td bgcolor="tomato">5</td> 
            <td rowspan="3" bgcolor="potato">6</td> 
        </tr> 
        <tr> 
            <td bgcolor="red">7</td> 
            <td bgcolor="pupler">8</td> 
        </tr>
        <tr> 
            <td colspan="2" bgcolor="lime">9</td>     
        </tr>
    </table> 
    </body> 
</html>
