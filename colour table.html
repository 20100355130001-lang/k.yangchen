html>
    <head> 
        <title>1 to 9 Colored Table</title> 
    </head> 
    <body> 
    <table border="0" width="100%" height="100%"> 
        <tr> 
            <td bgcolor="green">1</td> 
            <td colspan="3" bgcolor="pink">2</td>
        </tr> 
        <tr> 
            <td rowspan="3" bgcolor="yellow">3</td>     
            <td bgcolor="orange">4</td> 
            <td bgcolor="chilli">5</td> 
            <td rowspan="3" bgcolor="carrot">6</td> 
        </tr> 
        <tr> 
            <td bgcolor="black">7</td> 
            <td bgcolor="pink">8</td> 
        </tr>
        <tr> 
            <td colspan="2" bgcolor="lime">9</td>     
        </tr>
    </table> 
    </body> 
</html>
